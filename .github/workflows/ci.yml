name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kjakeportacio/devops-intern-final

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck scripts/sysinfo.sh scripts/healthcheck.sh

      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine < app/Dockerfile

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and save image
        run: |
          docker build \
            --build-arg "BUILD_SHA=$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            ./app
          docker save \
            --output "$RUNNER_TEMP/nginx-image.tar" \
            "$IMAGE_NAME:$GITHUB_SHA"

      - uses: actions/upload-artifact@v7
        with:
          name: nginx-image
          path: ${{ runner.temp }}/nginx-image.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test container
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nginx-image
          path: ${{ runner.temp }}

      - name: Load and start image
        run: |
          docker load --input "$RUNNER_TEMP/nginx-image.tar"
          docker run --detach \
            --name nginx-test \
            --publish 8080:8080 \
            "$IMAGE_NAME:$GITHUB_SHA"

      - name: Wait for readiness and run health check
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' nginx-test)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 1
          done

          if [ "$status" != "healthy" ]; then
            docker logs nginx-test
            exit 1
          fi

          ./scripts/healthcheck.sh http://127.0.0.1:8080

  publish:
    name: Publish to GHCR
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nginx-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "$RUNNER_TEMP/nginx-image.tar"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push commit and latest tags
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"
